# Cycle or train — your settings. Edit this file, commit, and the next run uses it.

# Home (weekend screen) and NDSM (where the bike leg starts). Coordinates: right-click a spot in Google Maps to copy them.
home:
  name: Haarlem
  lat: 52.3874
  lon: 4.6462
work:
  name: NDSM
  lat: 52.4012
  lon: 4.8919

# Where the last leg is ridden: BIKE only if ALL of these are dry. The screen also shows
# each place's chance of rain. Add or remove places freely.
bike_areas:
  - {name: NDSM, lat: 52.4012, lon: 4.8919}       # your ride to the studio
  - {name: Halfweg, lat: 52.3870, lon: 4.7516}    # Jane's stop

# The train you take every day (its status shows in the corner with an NS key). Codes: HLM = Haarlem, ASD = Amsterdam Centraal,
# ASS = Amsterdam Sloterdijk, ASDZ = Amsterdam Zuid. Full list: NS "stations" API.
train:
  from_station: HLM
  to_station: ASD

commute:
  leave_morning: "07:00"        # leaving home (shown on screen)
  leave_evening: "17:30"        # leaving the studio
  bike_leg_after_minutes: 45    # from leaving home to getting on the bike at NDSM
  bike_minutes: 20              # how long the NDSM <-> studio ride takes
  workdays: [mon, tue, wed, thu, fri]   # commute days; other days get the weekend screen

# BIKE only if it's completely dry in every bike area during both rides; otherwise BUS.
rules:
  rain_from_mm: 0.1             # any measurable rain (mm per hour) = BUS
  storm_gusts_kmh: 75           # STORM screen: suggests staying home

display:
  # Optional line under the big word, e.g. "BIKE › FERRY › BIKE". Off by default.
  # route_ride: ""
  # route_train: ""
  rotate_180: false             # flip if the image shows upside down on the device
  dutch_word: true              # show the Dutch word for the day's weather
  weekend_screen: true          # non-commute days: just "will it rain at home?"
  weekend_hours: [8, 20]        # the part of the day the weekend screen looks at
  timezone: Europe/Amsterdam

forecast:
  model: knmi_seamless          # KNMI's Harmonie model; 'best_match' also works
