; Cycle-or-train firmware for the Xteink X4 (ESP32-C3).
;
; Display, board and power code come from the FreeInk SDK (the same library the
; CrossPoint reader firmware uses), vendored as a git submodule in ./freeink-sdk.
; Text on the stats screen uses Adafruit GFX.

[env:x4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_DEVICE_X4=1
build_unflags =
  -std=gnu++11

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  https://github.com/adafruit/Adafruit_BusIO.git#1.17.0
  https://github.com/adafruit/Adafruit-GFX-Library.git#1.12.1
